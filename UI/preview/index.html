<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Live Traffic panel preview</title>
<style>
    /* The game sets 1rem = 1px. Coherent Gameface only lays out a row side by side when the class says display: flex
       (flex-direction: row alone is not enough), so the preview does not make elements flex by default either. */
    html { font-size: 1px; }
    body { margin: 0; font-size: 14rem; font-family: "Segoe UI", sans-serif; color: white;
           background: #3b4a3a linear-gradient(135deg, #46573f, #2c3a2e); min-height: 100vh; }
    #root { padding: 20rem; }
    .preview-panel { display: flex; flex-direction: column; width: 820rem; background: rgba(24, 33, 41, 0.92); border-radius: 8rem; overflow: hidden; }
    .preview-panel-header { display: flex; flex-direction: row; justify-content: center; align-items: center; padding: 10rem;
                            background: rgba(17, 24, 30, 0.95); color: #8fd1ff; font-size: 18rem; letter-spacing: 1rem; position: relative; }
    .preview-close { position: absolute; right: 14rem; cursor: pointer; }
    .preview-panel-content { padding: 10rem 14rem; }
    .preview-button { display: flex; width: 40rem; height: 40rem; align-items: center; justify-content: center; background: #2a6db0;
                      border-radius: 6rem; cursor: pointer; margin-bottom: 8rem; font-weight: bold; }
    .preview-tip-host { position: relative; }
    .preview-tip { position: absolute; left: 0; top: 100%; z-index: 10; background: rgba(10, 14, 18, 0.97);
                   border: 1rem solid #555; padding: 6rem 8rem; width: 420rem; }
    #triggers { position: fixed; right: 10rem; bottom: 10rem; font: 11px monospace; color: #ccc; white-space: pre;
                max-height: 120px; overflow: hidden; }
</style>
</head>
<body>
<div id="root"></div>
<div id="triggers"></div>
<script src="sample-data.js"></script>
<script src="sample-history.js"></script>
<script src="dist/preview.js"></script>
</body>
</html>
